name: Katabump Auto Renew

on:
  schedule:
    # 每天 UTC 0 点（北京时间 8 点）
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  renew:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install System & Python Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb x11-utils xdotool scrot fonts-noto-cjk
          pip install seleniumbase requests
          seleniumbase install chromedriver

      - name: Start Cloudflare WARP (proxy mode)
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --dearmor --yes -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ jammy main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y cloudflare-warp
          warp-cli --accept-tos registration new || warp-cli registration new
          warp-cli --accept-tos mode proxy || warp-cli mode proxy
          warp-cli --accept-tos connect || warp-cli connect
          ok=0
          for i in $(seq 1 12); do
            st="$(warp-cli --accept-tos status 2>&1 || warp-cli status 2>&1 || true)"
            echo "$st"
            echo "$st" | grep -qi "Connected" && ok=1 && break
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "WARP did not reach Connected state"
            exit 1
          fi
          echo "--- egress check via socks5://127.0.0.1:40000 ---"
          ip="$(curl -s -m 30 -x socks5h://127.0.0.1:40000 https://api.ip.sb/ip || true)"
          echo "egress IP: ${ip:-<empty>}"
          if [ -z "$ip" ]; then
            echo "WARP proxy check failed"
            exit 1
          fi
          echo "WARP proxy reachable"

      - name: Run Renew Script
        env:
          USERS_JSON: ${{ secrets.USERS_JSON }}
          KATABUMP_EMAIL: ${{ secrets.KATABUMP_EMAIL }}
          KATABUMP_PASSWORD: ${{ secrets.KATABUMP_PASSWORD }}
          PROXY_SERVER: socks5://127.0.0.1:40000
          IS_PROXY: "true"
          NODE_ATTEMPTS: "3"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 main.py

      - name: Upload Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renew-artifacts
          path: |
            *.png
            screenshots/
            singbox.log
            config.json
          if-no-files-found: ignore
